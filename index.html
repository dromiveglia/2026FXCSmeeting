    case 'register':    openModal('参会报名', registerHtml()); bindZoom(); break;
    case 'agenda':      openModal('详细议程', agendaHtml(), true); bindAgenda(); break;
    case 'experts':     openModal('演讲专家', expertsHtml()); break;
    case 'overview':    openModal('会议总览', overviewHtml()); bindZoom(); break;

/* ---- 会议议程（图片 + 左侧竖排目录，手机端抽屉呼出） ---- */
function agendaHtml(){
  const imgs = CONF.sessionImages || [];
  const list = imgs.length ? imgs : SESSIONS;
  if(!list.length) return '<p>议程即将发布</p>';
  const tabs = list.map((s,i)=>`<button class="tab-btn${i===0?' active':''}" data-i="${i}">${s.name}</button>`).join('');
  const panes = list.map((s,i)=>{
    const head = s.timePlace ? `<div style="margin-bottom:8px;color:#33475c"><strong>${s.timePlace}</strong></div>` : '';
    const body = imgs.length
      ? `<img src="${s.image}" alt="${s.name}" loading="lazy" data-zoom onerror="this.outerHTML='<p>议程图片加载失败：${s.image}</p>'">`
      : (s.tableHtml||'').replace(/session-table/g,'agenda-table');
    return `<div class="agenda-pane${i===0?' active':''}" data-i="${i}">${head}${body}</div>`;
  }).join('');
  return `<button class="agenda-drawer-btn" id="agendaDrawerBtn"><i class="fas fa-list"></i> 选择场次</button>
    <div class="agenda-layout">
      <div class="agenda-tabs" id="agendaTabs">${tabs}</div>
      <div style="flex:1;min-width:0" id="agendaPanes">${panes}</div>
    </div>`;
}
function bindAgenda(){
  const tabs = document.getElementById('agendaTabs');
  tabs.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
    tabs.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('#agendaPanes .agenda-pane').forEach(p => p.classList.toggle('active', p.dataset.i === btn.dataset.i));
    closeDrawer();
  }));
  document.getElementById('agendaDrawerBtn').addEventListener('click', () => {
    tabs.classList.add('open'); document.getElementById('drawerMask').classList.add('active');
  });
  bindZoom();
}
function closeDrawer(){
  const tabs = document.getElementById('agendaTabs');
  if(tabs) tabs.classList.remove('open');
  document.getElementById('drawerMask').classList.remove('active');
}

/* ---- 轮播：图片10s换页，视频播完2s换页 ---- */
const carousel = { index:0, timer:null, slides:[], track:null };
function buildCarousel(){
  const data = CONF.carouselSlides || [];
  if(!data.length) return;
  document.getElementById('carousel').innerHTML = `
    <div class="carousel">
      <div class="carousel-title"><i class="fas fa-images"></i> 往届精彩影像集锦（自动播放）</div>
      <div class="carousel-stage">
        <div class="carousel-track" id="cTrack">${data.map(item =>
          item.type === 'video'
            ? `<div class="slide"><video controls muted playsinline preload="metadata" src="${item.src}"></video></div>`
            : `<div class="slide"><img src="${item.src}" alt="精彩影像" loading="lazy"></div>`
        ).join('')}</div>
        <button class="carousel-btn prev" id="cPrev"><i class="fas fa-chevron-left"></i></button>
        <button class="carousel-btn next" id="cNext"><i class="fas fa-chevron-right"></i></button>
      </div>
      <div class="dots" id="cDots">${data.map((_,i)=>`<div class="dot${i===0?' active':''}" data-i="${i}"></div>`).join('')}</div>
    </div>`;
  carousel.track = document.getElementById('cTrack');
  carousel.slides = Array.from(document.querySelectorAll('.slide'));
  document.getElementById('cPrev').addEventListener('click', () => go(-1));
  document.getElementById('cNext').addEventListener('click', () => go(1));
  document.querySelectorAll('.dot').forEach(d => d.addEventListener('click', () => goTo(+d.dataset.i)));
  let startX = 0;
  carousel.track.addEventListener('touchstart', e => startX = e.touches[0].clientX);
  carousel.track.addEventListener('touchend', e => {
    if(!startX) return;
    const diff = e.changedTouches[0].clientX - startX;
    if(Math.abs(diff) > 50) go(diff > 0 ? -1 : 1);
    startX = 0;
  });
  schedule();
}
function render(){
  carousel.track.style.transform = `translateX(-${carousel.index*100}%)`;
  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i === carousel.index));
}
function schedule(){
  clearTimeout(carousel.timer);
  if(carousel.slides.length <= 1) return;
  const video = carousel.slides[carousel.index].querySelector('video');
  if(video){
    video.currentTime = 0;
    video.onended = () => { carousel.timer = setTimeout(() => go(1, false), 2000); };
    video.play().catch(()=>{});
  }else{
    carousel.timer = setTimeout(() => go(1, false), 10000);
  }
}
function goTo(i, manual = true){
  const cur = carousel.slides[carousel.index].querySelector('video');
  if(cur){ cur.pause(); cur.onended = null; }
  carousel.index = (i + carousel.slides.length) % carousel.slides.length;
  render(); schedule();
}
function go(delta, manual = true){ goTo(carousel.index + delta, manual); }

/* ================= 事件绑定 ================= */
function bindGlobal(){
  document.body.addEventListener('click', e => {
    const opener = e.target.closest('[data-open]');
    if(opener) openModule(opener.dataset.open);
  });
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });
  document.getElementById('drawerMask').addEventListener('click', closeDrawer);
  document.getElementById('imgViewer').addEventListener('click', () => document.getElementById('imgViewer').classList.remove('active'));
  document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeModal(); closeDrawer(); } });
}

/* ================= 启动 ================= */
(async function init(){
  await loadConfig();
  applyBackground();
  renderHero(); renderWelcome(); renderCards(); buildCarousel(); renderFooter();
  bindGlobal();
})();
</script>
